name: CI Pipeline

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Maven
        run: mvn clean package
        
      - name: Check secrets exist
        run: |
          echo "Username length: ${#DOCKER_USERNAME}"
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}  

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/github-action-demo:${{ github.run_number }} .
          docker push ${{ secrets.DOCKER_USERNAME }}/github-action-demo:${{ github.run_number }}

      - name: Deploy to QA EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.QA_EC2_HOST }}
          username: ${{ secrets.QA_EC2_USER }}
          key: ${{ secrets.QA_EC2_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/github-action-demo:${{ github.run_number }}
            docker stop github-action-demo || true
            docker rm github-action-demo || true
            docker run -d --name github-action-demo -p 8080:8080 ${{ secrets.DOCKER_USERNAME }}/github-action-demo:${{ github.run_number }}

      - name: Health Check
        run: |
          sleep 10
          curl -f http://${{ secrets.QA_EC2_HOST }}:8080/actuator/health

      - name: Rollback on failure
        if: failure()
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.QA_EC2_HOST }}
          username: ${{ secrets.QA_EC2_USER }}
          key: ${{ secrets.QA_EC2_SSH_KEY }}
          script: |
            docker stop github-action-demo || true
            docker rm github-action-demo || true
            docker run -d --name github-action-demo -p 8080:8080 ${{ secrets.DOCKER_USERNAME }}/github-action-demo:${{ github.run_number }}